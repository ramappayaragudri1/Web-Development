<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=login-register.html">
  <title>Men's Fashion Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Men's Fashion</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="products.html">Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="logout.html">Logout</a>
          </li>
        </ul>
        <div class="d-flex align-items-center">
          <div class="search-box me-3">
            <input type="text" class="search-input" id="searchInput" placeholder="Search products...">
            <button class="search-btn" id="searchButton">
              <i class="fas fa-search"></i>
            </button>
          </div>
          <button class="cart-btn" id="cartButton">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count" id="cartCount">0</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="container">
      <h1>Premium Men's Fashion</h1>
      <p class="lead mb-4">Discover our exclusive collection of high-quality clothing and accessories</p>
      <a href="products.html" class="btn btn-primary btn-lg">Shop Now</a>
    </div>
  </section>

  <!-- Featured Products -->
  <div class="container mb-5">
    <h2 class="text-center mb-4">Featured Products</h2>
    <div class="product-container" id="productContainer">
      <!-- Products loaded via JavaScript -->
    </div>
    <div class="text-center">
      <button class="view-all-btn" onclick="window.location.href='products.html'">
        View All Products <i class="fas fa-arrow-right ms-2"></i>
      </button>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Your Cart</h3>
        <button class="btn-close" id="closeCart"></button>
      </div>
      <div id="cartItems">
        <p class="text-center py-3">Your cart is empty</p>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
        <h5>Total:</h5>
        <h5 id="cartTotal">$0.00</h5>
      </div>
      <button class="btn btn-primary w-100 mt-3" id="checkoutBtn">Checkout</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="index.js"></script>
</html>
